[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slide-transpiler"
version = "1.0.0"
description = "Convert PPTX slides between templates by cloning, rebinding, and injecting slide packages"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
slide-transpiler = "slide_transpiler.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
